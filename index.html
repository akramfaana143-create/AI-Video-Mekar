<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Mekar - AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .download-btn {
      display: none;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #0f172a;
      display: none;
      line-height: 1.5;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 14px;
      display: none;
      background: black;
    }

    .error {
      color: #fca5a5;
    }

    .success {
      color: #86efac;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 AI Video Mekar</h1>

  <div class="subtitle">
    Create AI videos with synchronized audio
  </div>

  <div class="card">

    <label for="story">Write your story</label>

    <textarea
      id="story"
      placeholder="Example: A little boy walks through a beautiful forest. Birds are singing and a friendly monkey comes to meet him..."
    ></textarea>

    <button id="generateBtn">
      🎬 Generate Video
    </button>

    <div id="status" class="status"></div>

    <video
      id="video"
      controls
      playsinline
    ></video>

    <a
      id="downloadBtn"
      class="download-btn"
      href="#"
      target="_blank"
      rel="noopener"
    >
      ⬇️ Download Video
    </a>

    <div class="small">
      🎙️ AI synchronized audio is enabled.
      <br>
      Video generation may take a few minutes.
    </div>

  </div>

</div>

<script>

  // YOUR CLOUDFLARE WORKER
  const WORKER_URL =
    "https://green-breeze-76bd.akramfaana143.workers.dev";


  const generateBtn =
    document.getElementById("generateBtn");

  const storyInput =
    document.getElementById("story");

  const statusBox =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  const downloadBtn =
    document.getElementById("downloadBtn");


  function showStatus(message, type = "") {

    statusBox.style.display = "block";

    statusBox.className =
      "status " + type;

    statusBox.innerHTML = message;
  }


  generateBtn.addEventListener("click", async () => {

    const story =
      storyInput.value.trim();


    if (!story) {

      showStatus(
        "Please write your story first.",
        "error"
      );

      return;
    }


    generateBtn.disabled = true;


    video.style.display = "none";

    video.removeAttribute("src");

    video.load();


    downloadBtn.style.display = "none";

    downloadBtn.removeAttribute("href");


    showStatus(
      "⏳ Sending your story to the AI video generator..."
    );


    try {

      const response = await fetch(
        WORKER_URL + "/generate",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: story
          })
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Video generation request failed."
        );
      }


      const predictionId =
        data.id ||
        data.prediction?.id;


      if (!predictionId) {

        throw new Error(
          "Prediction ID was not returned by the server."
        );
      }


      showStatus(
        "🎬 Video generation started...<br><br>" +
        "🔊 Audio is enabled.<br><br>" +
        "Please wait. This can take a few minutes."
      );


      await checkStatus(predictionId);


    } catch (error) {

      console.error(error);

      showStatus(
        "❌ Error: " +
        error.message,
        "error"
      );

      generateBtn.disabled = false;
    }

  });


  async function checkStatus(id) {

    let attempts = 0;

    const maxAttempts = 180;


    while (attempts < maxAttempts) {

      attempts++;


      await new Promise(
        resolve =>
          setTimeout(resolve, 5000)
      );


      try {

        const response =
          await fetch(
            WORKER_URL +
            "/status?id=" +
            encodeURIComponent(id)
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Status request failed."
          );
        }


        const status =
          data.status ||
          data.prediction?.status;


        if (
          status === "starting" ||
          status === "processing"
        ) {

          showStatus(
            "⏳ AI is creating your video...<br><br>" +
            "Status: " +
            status +
            "<br><br>" +
            "🔊 Audio is enabled.<br><br>" +
            "Please keep this page open."
          );

          continue;
        }


        if (status === "succeeded") {

          const output =
            data.output ||
            data.prediction?.output;


          let videoUrl = null;


          if (
            typeof output === "string"
          ) {

            videoUrl = output;

          } else if (
            Array.isArray(output)
          ) {

            videoUrl = output[0];

          }


          if (!videoUrl) {

            throw new Error(
              "Video was generated but no video URL was returned."
            );
          }


          // SHOW VIDEO
          video.src = videoUrl;

          video.style.display = "block";

          video.load();


          // SHOW DOWNLOAD BUTTON
          downloadBtn.href = videoUrl;

          downloadBtn.style.display =
            "block";


          showStatus(
            "✅ Your video is ready!<br><br>" +
            "🔊 Audio included.<br><br>" +
            "⬇️ Tap Download Video to save it.",
            "success"
          );


          generateBtn.disabled = false;


          return;
        }


        if (status === "failed") {

          throw new Error(
            data.error ||
            data.prediction?.error ||
            "Video generation failed."
          );
        }


        if (status === "canceled") {

          throw new Error(
            "Video generation was canceled."
          );
        }

      } catch (error) {

        console.error(error);

        showStatus(
          "❌ " +
          error.message,
          "error"
        );

        generateBtn.disabled = false;

        return;
      }

    }


    showStatus(
      "⏰ Video generation is taking longer than expected. Please try again later.",
      "error"
    );


    generateBtn.disabled = false;

  }

</script>

</body>
</html>
